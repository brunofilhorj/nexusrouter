name: Deploy to Development

on:
  workflow_dispatch:

concurrency:
  group: deploy-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Build & Test
        run: |
          dotnet build NexusRouter.slnx --configuration Release
          dotnet test NexusRouter.slnx --configuration Release --no-build

  deploy:
    name: Execute Deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Deployment Tools
        run: echo "Configurando ferramentas de infraestrutura (Ex: AWS, Docker, K8s, etc.)..."

      - name: Publish Application
        run: dotnet publish NexusRouter.slnx --configuration Release --output ./publish

      - name: Release to Development Server
        run: |
          echo "Executando o deploy de ${{ github.sha }} para o ambiente de development..."
